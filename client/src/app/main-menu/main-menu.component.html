<div id="menu" class="menu flex">
    <h1 class="text-[60px] font-bold uppercase">
        <span>Game</span>
    </h1>

    <div class="min-w-[400px]">
        <input
            #name
            id="playerNameInput"
            type="text"
            class="mb-8 rounded-lg"
            placeholder="your name"
            [value]="lobbyStore.user()?.name || ''"
        />

        <button
            id="createBtn"
            class="btn btn-primary w-full"
            type="button"
            (click)="createGame(name.value)"
        >
            create
        </button>

        <p class="text-center text-xl my-2">or</p>

        <div class="flex">
            <input
                #gameId
                class="rounded-l-lg"
                id="gameIdInput"
                type="text"
                name="gameId"
                placeholder="game ID"
                [formControl]="gameIdInput"
                [value]="lobbyStore.gameId() || ''"
            />
            <button
                class="btn btn-secondary rounded-r-lg"
                type="button"
                (click)="joinGame(name.value, gameId.value)"
            >
                join
            </button>
        </div>
        @if (lobbyStore.connectionErrorMessage()) {
            <p class="text-red-500 mt-4">
                {{ lobbyStore.connectionErrorMessage() }}
            </p>
        }
    </div>
</div>
